name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Linux (GCC)
            os: ubuntu-latest
          - name: macOS (AppleClang / CPU)
            os: macos-latest
          - name: Windows (MSVC / CPU)
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyTorch (LibTorch)
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" || "${{ runner.os }}" == "Windows" ]]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch
          fi
          TORCH_DIR=$(python -c "import torch; print(torch.utils.cmake_prefix_path)")
          echo "CMAKE_PREFIX_PATH=$TORCH_DIR" >> $GITHUB_ENV
          echo "Torch cmake path: $TORCH_DIR"

          TORCH_LIB=$(python -c "import os, torch; print(os.path.join(os.path.dirname(torch.__file__), 'lib'))")
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "$TORCH_LIB" >> $GITHUB_PATH
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "LD_LIBRARY_PATH=$TORCH_LIB:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "DYLD_LIBRARY_PATH=$TORCH_LIB:${DYLD_LIBRARY_PATH:-}" >> $GITHUB_ENV
          fi

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300

      - name: E2E Training Smoke Test
        shell: bash
        run: |
          TRAIN_BIN="./build/perfectpao_train"
          if [ -f "./build/Release/perfectpao_train.exe" ]; then
            TRAIN_BIN="./build/Release/perfectpao_train.exe"
          elif [ -f "./build/Release/perfectpao_train" ]; then
            TRAIN_BIN="./build/Release/perfectpao_train"
          fi
          $TRAIN_BIN --updates 2 --games 16 --mb 64 --epochs 2 --threads 2 --pool-every 1 \
            --rule-opponent-prob 0.3 \
            --eval-every 1 --eval-decks 2 --out build/ci_ckpt \
            --eval-save-dir build/ci_eval_snapshots --eval-csv build/ci_eval.csv \
            --pimc-every 2 --pimc-decks 1 --pimc-worlds 2 --pimc-iters 5 --pimc-threads 1 \
            --pimc-save-dir build/ci_pimc_snapshots --pimc-csv build/ci_pimc_eval.csv

          # Verify checkpoints and evaluation snapshots were written to disk
          test -f build/ci_ckpt/actor.pt
          test -f build/ci_ckpt/critic.pt
          test -f build/ci_ckpt/meta.txt
          test -d build/ci_eval_snapshots/u1
          test -f build/ci_eval_snapshots/u1/actor.pt
          test -f build/ci_eval_snapshots/u1/meta.txt
          test -s build/ci_eval.csv
          test -s build/ci_pimc_eval.csv
          test -d build/ci_pimc_snapshots/u2
          test -f build/ci_pimc_snapshots/u2/actor.pt

          EVAL_BIN="./build/perfectpao_eval"
          if [ -f "./build/Release/perfectpao_eval.exe" ]; then
            EVAL_BIN="./build/Release/perfectpao_eval.exe"
          elif [ -f "./build/Release/perfectpao_eval" ]; then
            EVAL_BIN="./build/Release/perfectpao_eval"
          fi
          $EVAL_BIN --ckpt build/ci_ckpt --decks 2
          $EVAL_BIN --ckpt build/ci_ckpt --decks 1 --opponent pimc --worlds 2 --iters 5 --threads 1

          python3 -m py_compile tools/plot_eval.py
